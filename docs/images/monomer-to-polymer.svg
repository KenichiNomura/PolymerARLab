<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#334155">Isoprene</text>
  <text x="20" y="50" font-size="12" fill="#64748b">C1=C2(–CH₃)–C3=C4</text>
  <g fill="#8a8f98">
    <circle cx="45" cy="100" r="13"/><circle cx="105" cy="100" r="13"/><circle cx="165" cy="100" r="13"/><circle cx="225" cy="100" r="13"/>
  </g>
  <g fill="#fff" font-size="10" text-anchor="middle">
    <text x="45" y="104">C1</text><text x="105" y="104">C2</text><text x="165" y="104">C3</text><text x="225" y="104">C4</text>
  </g>
  <g stroke="#64748b" stroke-width="2.3">
    <line x1="58" y1="94" x2="92" y2="94"/><line x1="58" y1="106" x2="92" y2="106"/>
    <line x1="118" y1="100" x2="152" y2="100"/>
    <line x1="178" y1="94" x2="212" y2="94"/><line x1="178" y1="106" x2="212" y2="106"/>
    <line x1="105" y1="87" x2="105" y2="65" stroke-width="2"/>
  </g>
  <text x="105" y="61" text-anchor="middle" font-size="11" fill="#64748b">CH₃</text>
  <text x="135" y="142" text-anchor="middle" font-size="12" fill="#d08700">select terminal C1 and C4</text>
  <path d="M255 100 h55" stroke="#64748b" stroke-width="2" marker-end="url(#p)"/>
  <text x="282" y="83" text-anchor="middle" font-size="11" fill="#64748b">1,4<tspan x="282" dy="13">addition</tspan></text>

  <text x="335" y="28" font-size="13" font-weight="700" fill="#334155">Repeat unit</text>
  <text x="335" y="50" font-size="12" fill="#64748b">–C1–C2=C3–C4–</text>
  <g fill="#8a8f98"><circle cx="345" cy="100" r="11"/><circle cx="395" cy="100" r="11"/><circle cx="445" cy="100" r="11"/><circle cx="495" cy="100" r="11"/></g>
  <g stroke="#64748b" stroke-width="2.3">
    <line x1="356" y1="100" x2="384" y2="100"/>
    <line x1="406" y1="94" x2="434" y2="94"/><line x1="406" y1="106" x2="434" y2="106"/>
    <line x1="456" y1="100" x2="484" y2="100"/>
  </g>
  <g stroke="#64748b" stroke-width="2" stroke-dasharray="3 3"><line x1="334" y1="100" x2="320" y2="100"/><line x1="506" y1="100" x2="520" y2="100"/></g>
  <path d="M540 100 h42" stroke="#64748b" stroke-width="2" marker-end="url(#p)"/>

  <text x="605" y="28" font-size="13" font-weight="700" fill="#334155">Choose geometry</text>
  <rect x="598" y="62" width="64" height="30" rx="7" fill="#e7f5f2" stroke="#1e7d74"/>
  <text x="630" y="82" text-anchor="middle" font-size="12" fill="#1e7d74">Cis</text><text x="673" y="82" font-size="12" fill="#64748b">rubber</text>
  <rect x="598" y="106" width="64" height="30" rx="7" fill="none" stroke="#64748b"/>
  <text x="630" y="126" text-anchor="middle" font-size="12" fill="#334155">Trans</text><text x="673" y="126" font-size="12" fill="#64748b">gutta-percha</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#64748b">Two double bonds become single bonds; a new C2=C3 double bond remains.</text>
</svg>
